# Run the tests against SQLite: mvn test -Dspring.profiles.active=sqlite
spring.test.database.replace=none
# WAL lets a reader and the writer work at once, busy_timeout waits out the write lock
spring.datasource.url=jdbc:sqlite:target/sqlite-test.db?journal_mode=WAL&busy_timeout=10000
spring.datasource.driverClassName=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

# GenerationType.AUTO falls back to a sequence table here, IDENTITY takes its place
spring.jpa.mapping-resources=orm-sqlite.xml

# EclipseLink ships no SQLite platform, so this profile is Hibernate and the Criteria API
# alone. H2Platform comes close but builds the key as BIGINT, and SQLite fills in a key of
# its own on INTEGER PRIMARY KEY alone.
