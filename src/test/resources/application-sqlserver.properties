# Run the tests against SQL Server: mvn test -Dspring.profiles.active=sqlserver
spring.test.database.replace=none
# calcBigDecimalPrecision keeps the driver from binding every BigDecimal as decimal(38,0),
# which otherwise costs a coalesce its decimals: 0.90 comes back as 1.
# trustServerCertificate because the server carries a self-signed certificate.
spring.datasource.url=jdbc:sqlserver://192.168.0.63:11433;databaseName=demo;encrypt=true;trustServerCertificate=true;calcBigDecimalPrecision=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=admin
spring.datasource.password=admin123

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=create-drop
